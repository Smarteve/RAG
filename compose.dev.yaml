# Use with: docker compose -f compose.yaml -f compose.dev.yaml up -d --wait
x-development: &development
  environment:
    # Prefer the mounted source over the package installed in the image.
    PYTHONPATH: /app/src
  volumes:
    - ./src:/app/src:ro

services:
  api:
    <<: *development
    command:
      - /app/.venv/bin/uvicorn
      - nexusrag.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src

  worker:
    <<: *development

  sweeper:
    <<: *development
