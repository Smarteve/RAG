[project]
name = "nexusrag"
version = "0.1.0"
description = "An async multimodal document processing and RAG engine"
readme = "README.md"
authors = [
    { name = "evelyn", email = "evelynyyr11@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.14.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "qdrant-client==1.20.0",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=6.1.0,<7",
    "torch>=2.14.1,<3",
]
generation = [
    "groq>=1.7.0",
]

[project.scripts]
nexusrag = "nexusrag:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py315"

[tool.uv]
# Resolve only our supported deployment platform, including optional extras.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
